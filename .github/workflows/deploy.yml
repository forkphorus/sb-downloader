name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Assemble website
      run: |
        mkdir -p dist/lib
        cp index.html dist/
        cp lib/bundle-standalone.js dist/lib/
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
